<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Embed</title>
    <style>
        /* Force root structures to clear default website paddings */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #000000 !important;
        }

        /* Build a responsive box to containerize the presentation engine */
        .canva-viewport-container {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 999999 !important;
        }

        /* Enforce absolute full-screen scaling for the frame */
        .canva-viewport-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="canva-viewport-container">
        <!-- Embedded Canva Asset -->
        <iframe 
            loading="lazy" 
            src="https://canva.com"
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

</body>
</html>
