<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portfolio</title>
    <style>
        /* Erase standard browser padding and lock viewport limits */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #000000 !important;
        }

        /* Build structural wrapper to containerize the iframe stream */
        .canva-frame-container {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        /* Force responsive scaling across mobile and desktop sizes */
        .canva-frame-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>

    <div class="canva-frame-container">
        <!-- Changed to the official API token URL path to bypass the connection block -->
        <iframe 
            src="https://canva.com"
            " 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

</body>
</html>
