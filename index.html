<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Display</title>
    <style>
        /* Erase all margins and hide browser layout bars */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #000000 !important;
        }

        /* Set viewport bounds to fill the device screen entirely */
        .fullscreen-view {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        /* Force iframe to follow fluid responsive styling matrix */
        .fullscreen-view iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>

    <div class="fullscreen-view">
        <!-- Using the public secure token stream link for design DAHMFNzLrTk -->
        <iframe 
            src="https://canva.com"
            " 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

</body>
</html>
