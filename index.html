<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Portfolio</title>
    <style>
        /* Erase standard browser padding and completely hide desktop/mobile scrollbars */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #000000 !important;
        }

        /* Enforce a strict full-viewport structural container */
        .viewport-wrapper {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Stretch the secure iframe to fluidly fill 100% of the screen area */
        .viewport-wrapper iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="viewport-wrapper">
        <!-- Secure authenticated Canva stream containing the public viewing token -->
        <iframe 
            loading="lazy" 
            src="https://canva.com" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

</body>
</html>
